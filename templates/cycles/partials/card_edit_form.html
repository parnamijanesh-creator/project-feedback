<div id="card-{{ card.id }}" class="bg-indigo-50/40 p-4 rounded-xl border border-indigo-200 shadow-sm transition">
    <form hx-post="{% url 'card_edit' slug=project.slug cycle_pk=cycle.pk card_pk=card.id %}"
          hx-target="#card-{{ card.id }}"
          hx-swap="outerHTML"
          class="space-y-3">
        {% csrf_token %}
        <div class="flex justify-between items-center text-xs text-indigo-900 font-semibold mb-1">
            <span>Editing {{ card.get_category_display }} Card</span>
            {% if card.is_anonymous %}
                <span class="text-slate-400">🕵️ Anonymous</span>
            {% endif %}
        </div>

        <textarea name="text"
                  rows="3"
                  required
                  class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">{{ card.text }}</textarea>

        {% if error %}
            <p class="text-xs text-rose-600">{{ error }}</p>
        {% endif %}

        <div class="flex justify-end gap-2 text-xs pt-1">
            <button type="button"
                    hx-get="{% url 'card_detail_partial' slug=project.slug cycle_pk=cycle.pk card_pk=card.id %}"
                    hx-target="#card-{{ card.id }}"
                    hx-swap="outerHTML"
                    class="px-3 py-1.5 border border-slate-300 rounded-md text-slate-600 hover:bg-white transition">
                Cancel
            </button>
            <button type="submit"
                    class="px-3 py-1.5 rounded-md bg-indigo-600 text-white font-medium hover:bg-indigo-700 transition shadow-sm">
                Save Changes
            </button>
        </div>
    </form>
</div>
