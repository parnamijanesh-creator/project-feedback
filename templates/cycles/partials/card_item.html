<div id="card-{{ card.id }}" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow transition relative group">
    <div class="flex justify-between items-start mb-2">
        <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-bold uppercase tracking-wider
            {% if card.category == 'START' %}
                bg-emerald-100 text-emerald-800
            {% elif card.category == 'STOP' %}
                bg-rose-100 text-rose-800
            {% else %}
                bg-sky-100 text-sky-800
            {% endif %}">
            {{ card.get_category_display }}
        </span>
        <div class="flex items-center space-x-1">
            {% if card.is_anonymous %}
                <span class="inline-flex items-center text-xs text-slate-400 gap-1 bg-slate-50 px-1.5 py-0.5 rounded" title="Anonymous submission">
                    🕵️ Anonymous
                </span>
            {% else %}
                <span class="text-xs text-slate-500 font-medium">
                    {{ card.user.username }}
                </span>
            {% endif %}
        </div>
    </div>

    <p class="text-slate-800 text-sm whitespace-pre-wrap leading-relaxed">{{ card.text }}</p>

    {% if cycle.status == 'COLLECTING' %}
        <div class="mt-3 pt-2.5 border-t border-slate-100 flex justify-end gap-3 text-xs">
            <button hx-get="{% url 'card_edit' slug=project.slug cycle_pk=cycle.pk card_pk=card.id %}"
                    hx-target="#card-{{ card.id }}"
                    hx-swap="outerHTML"
                    class="font-medium text-slate-500 hover:text-indigo-600 transition">
                Edit
            </button>
            <button hx-post="{% url 'card_delete' slug=project.slug cycle_pk=cycle.pk card_pk=card.id %}"
                    hx-target="#card-{{ card.id }}"
                    hx-swap="outerHTML"
                    hx-confirm="Are you sure you want to delete this feedback card?"
                    class="font-medium text-rose-500 hover:text-rose-700 transition">
                Delete
            </button>
        </div>
    {% endif %}
</div>
