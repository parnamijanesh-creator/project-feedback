<div id="note-{{ note.id }}" class="p-3.5 bg-white rounded-xl border border-slate-200 shadow-xs space-y-2 text-xs transition">
    <div class="flex items-start justify-between gap-2">
        <p class="text-slate-800 leading-relaxed whitespace-pre-wrap flex-1">{{ note.text }}</p>
        {% if not is_locked %}
            {% if request.user == note.author or is_facilitator %}
                <button type="button"
                        hx-post="{% url 'topic_note_delete' note_id=note.id %}"
                        hx-target="#note-{{ note.id }}"
                        hx-swap="outerHTML"
                        hx-confirm="Are you sure you want to delete this note?"
                        class="text-slate-400 hover:text-rose-600 transition p-1 rounded hover:bg-slate-100"
                        title="Delete note">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
            {% endif %}
        {% endif %}
    </div>
    <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
        <span class="font-semibold text-slate-600">✍️ {{ note.author.username }}</span>
        <span>{{ note.created_at|date:"M d, g:i a" }}</span>
    </div>
</div>
