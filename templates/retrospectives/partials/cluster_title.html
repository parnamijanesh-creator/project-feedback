<div id="cluster-title-{{ cluster.id }}" class="flex items-center justify-between gap-2 group">
    <div class="flex items-center gap-2">
        <h4 class="font-bold text-slate-900 text-sm cursor-pointer hover:text-indigo-600 transition"
            hx-get="{% url 'cluster_update' slug=project.slug pk=cycle.pk cluster_id=cluster.pk %}"
            hx-target="#cluster-title-{{ cluster.id }}"
            hx-swap="outerHTML"
            title="Click to rename cluster">
            {{ cluster.title }}
        </h4>
        {% if cluster.is_ai_generated %}
            <span class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-purple-100 text-purple-700">AI</span>
        {% endif %}
    </div>
    <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
        <button type="button"
                hx-get="{% url 'cluster_update' slug=project.slug pk=cycle.pk cluster_id=cluster.pk %}"
                hx-target="#cluster-title-{{ cluster.id }}"
                hx-swap="outerHTML"
                class="text-xs text-slate-400 hover:text-indigo-600 p-1"
                title="Rename cluster">
            ✏️
        </button>
        <button type="button"
                hx-post="{% url 'cluster_delete' slug=project.slug pk=cycle.pk cluster_id=cluster.pk %}"
                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                hx-confirm="Are you sure you want to delete this cluster? All cards will be returned to the unclustered pool."
                hx-target="#cluster-{{ cluster.id }}"
                hx-swap="outerHTML"
                class="text-xs text-slate-400 hover:text-rose-600 p-1"
                title="Delete cluster">
            🗑️
        </button>
    </div>
</div>
